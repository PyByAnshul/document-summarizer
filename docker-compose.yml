services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - redis
    volumes:
      - media:/app/media

  worker:
    build: .
    env_file: .env
    depends_on:
      - redis
    volumes:
      - media:/app/media
    command: celery -A config worker -l info

  redis:
    image: redis:7-alpine

volumes:
  media:
